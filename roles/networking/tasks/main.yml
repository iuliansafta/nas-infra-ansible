---
- name: Validate explicitly managed interface
  ansible.builtin.assert:
    that: nas_primary_interface != 'REPLACE_ME'
  when: manage_netplan | bool
- name: Install managed Netplan configuration
  ansible.builtin.template:
    src: 60-nas.yaml.j2
    dest: /etc/netplan/60-nas.yaml
    mode: '0600'
  notify: Validate netplan
  when: manage_netplan | bool
