---
- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl]
    state: present
- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
- name: Download Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
- name: Configure official Docker deb822 repository
  ansible.builtin.template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    mode: '0644'
- name: Install Docker Engine and plugins
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    update_cache: true
- name: Create application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0750'
  loop: [/srv/compose, /srv/appdata]
- name: Enable Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
