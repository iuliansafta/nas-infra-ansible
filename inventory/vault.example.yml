---
# Copy to inventory/group_vars/all/vault.yml, replace every value, then run:
# ansible-vault encrypt inventory/group_vars/all/vault.yml
#
# The destination must be inside group_vars/all/: a group_vars/<name> file is
# only loaded when a group named <name> exists, and this inventory has no group
# called "vault", so any other path is imported silently as nothing.
#
# Keep global variables in the directory form (group_vars/all/all.yml), never as
# a sibling group_vars/all.yml. When both exist the directory wins and the
# sibling file is ignored without warning.
#
# This example deliberately lives outside group_vars/ - every file in
# group_vars/all/ is loaded as group vars, so an example kept there would inject
# its REPLACE_ME placeholders into the real configuration.
samba_passwords:
  iuliansafta: REPLACE_ME
immich_db_password: REPLACE_ME
vault_restic_password: REPLACE_ME
vault_tailscale_authkey: REPLACE_ME
