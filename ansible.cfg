[defaults]
inventory = inventory/home.yml
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
stdout_callback = ansible.builtin.default
# Executable password script; prints the master password read from 1Password.
# Applied to ansible-playbook and ansible-vault alike, so neither ever needs
# --ask-vault-pass. Requires `op` on PATH and the personal 1Password account.
vault_password_file = scripts/vault-pass.sh

[privilege_escalation]
become = True
